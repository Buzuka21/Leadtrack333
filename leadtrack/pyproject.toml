[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "leadtrack"
version = "0.1.0"
description = "A lightweight command-line CRM for BD/sales prospecting."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "Ayush"}]
keywords = ["crm", "sales", "cli", "business-development", "prospecting"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Intended Audience :: Other Audience",
    "Topic :: Office/Business",
]
dependencies = [
    "click>=8.0",
]

[project.scripts]
leadtrack = "leadtrack.cli:cli"

[project.urls]
Homepage = "https://github.com/YOUR_USERNAME/leadtrack"
Issues = "https://github.com/YOUR_USERNAME/leadtrack/issues"

[tool.setuptools]
packages = ["leadtrack"]
